description: '/dev/agents (homepage sdsa.ai) is building a next-generation operating
  system for AI agents - a cloud platform, developer tools, and new UI primitives
  meant to let autonomous agents coordinate work across a user''s apps and devices
  instead of people navigating individual applications. It was founded in 2024 by
  David Singleton (former Stripe CTO and Google Android VP of Engineering), Hugo Barra,
  Ficus Kirkpatrick, and Nicholas Jitkoff, and raised a $56M seed round at a $500M
  valuation led by Index Ventures with CapitalG and Conviction. As of this profile
  the company is pre-launch: it publishes no public API, SDK, or developer documentation
  yet, so this API Evangelist entry captures verified company identity and domain
  posture only.'
